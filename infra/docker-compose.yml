# Local infrastructure for nthstock (CLAUDE.md D7: Docker Compose locally through Phase 5):
# Redis 7 and PostgreSQL 16, both bound to loopback.
# Start: npm run infra:up   (or: docker compose -f infra/docker-compose.yml up -d --wait)
# Stop:  npm run infra:down
name: nthstock

services:
  redis:
    # Redis 7 (CLAUDE.md D6): quote pub/sub between apps/api and apps/realtime (ADR 0004 §4).
    image: redis:7-alpine
    # No persistence: pub/sub and caches only, state resets on restart like the in-memory repos.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      # Bound to loopback only: this Redis has no password and must not be reachable from the LAN.
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  postgres:
    # PostgreSQL 16 (CLAUDE.md D6, ADR 0007): the system of record for apps/api.
    image: postgres:16-alpine
    environment:
      # Local superuser for init.sql only; apps/api connects as nthstock_app (DML) and migrates as
      # nthstock_owner (DDL). Non-secret dev values, like the role passwords in init.sql.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: nthstock
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is empty: creates the three roles (infra/postgres/init.sql).
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    ports:
      # Loopback only: dev passwords, never reachable from the LAN.
      - '127.0.0.1:5432:5432'
    healthcheck:
      # The image listens on TCP only after init.sql has run, so healthy means the roles exist.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'nthstock_app', '-d', 'nthstock']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  # Survives `npm run infra:down`; `docker compose -f infra/docker-compose.yml down -v` resets it.
  postgres-data:
