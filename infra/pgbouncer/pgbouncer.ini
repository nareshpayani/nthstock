; PgBouncer in transaction mode for local checks (T-184, compose profile `pool`).
; apps/api must work unchanged through it: see "PgBouncer rules" in infra/README.md.

[databases]
; Every database on the compose Postgres, including the per-worker test databases.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; A server connection is shared between clients after every transaction, so nothing may outlive
; one: no session SET, LISTEN, session advisory locks, temp tables or named prepared statements.
pool_mode = transaction
max_prepared_statements = 0
max_client_conn = 500
default_pool_size = 20
