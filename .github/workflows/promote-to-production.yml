name: Promote to production

# Moves the production branch to develop's latest commit, which deploys the live site (ADR 0011,
# docs/runbooks/release.md). No release PR and no owner approval (owner decision 2026-10-22): an
# agent runs this when the owner asks for a production deploy, and the gate below is the check.
# Gate: develop's latest commit has a green CI run (unit, integration, every Playwright suite, web
# vitals, Storybook a11y) and is what the development environment last deployed and smoke-tested.
# Then production fast-forwards to that commit (or, when production holds only merge commits whose
# content develop already has, gets one merge commit with develop's exact tree). Never a force push.
# The push starts CI on production; green CI there deploys the live site and smoke-tests it
# (web-hosting.yml). Rollback: Web hosting, stage live, an older commit on production.
# Pushes with the PROMOTE_TOKEN secret (a fine-grained token with Contents and Workflows write on
# this repo): GITHUB_TOKEN can't push commits that change .github/workflows, and its pushes start
# no CI. Without the secret it falls back to GITHUB_TOKEN and dispatches CI on production itself.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  deployments: read

concurrency:
  group: promote-to-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote develop to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          # Only the push step gets credentials (PROMOTE_TOKEN, below).
          persist-credentials: false
      - name: Check develop is fully tested (CI green on this commit)
        run: bash tools/github/checkReleaseCommit.sh develop
      - name: Check the development site was deployed and smoke-tested on this commit
        run: |
          sha=$(git rev-parse HEAD)
          read -r id deployed < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=development&per_page=1" \
            --jq '.[0] | "\(.id) \(.sha)"')
          state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')
          if [ "$deployed" != "$sha" ] || [ "$state" != success ]; then
            echo "::error title=Development not on this commit::develop is at $sha, but the last development deploy is $deployed ($state). Wait for Web hosting to deploy develop (or run it with stage development), then promote again."
            exit 1
          fi
          echo "Development deployed and smoke-tested $sha."
      - name: Move production to develop
        id: move
        env:
          PUSH_TOKEN: ${{ secrets.PROMOTE_TOKEN || github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          if ! git fetch --quiet origin production; then
            echo "::error title=No production branch::Rename main to production first (docs/runbooks/environments.md)."
            exit 1
          fi
          prod=$(git rev-parse origin/production)
          if [ "$prod" = "$sha" ]; then
            echo "::notice title=Already live::production is already at $sha."
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$prod" "$sha"; then
            target=$sha
          elif [ -z "$(git rev-list --no-merges "$sha..$prod")" ]; then
            # production holds merge commits develop doesn't (the old release PRs). Merge develop in
            # and keep the result only if its files are exactly develop's.
            git config user.name 'Naresh Payani'
            git config user.email '15100692+nareshpayani@users.noreply.github.com'
            git checkout --quiet -B production "$prod"
            git merge --no-ff --no-edit -m "chore(release): promote develop ${sha:0:7} to production" "$sha"
            if ! git diff --quiet "$sha" HEAD; then
              echo "::error title=Production differs::The merged tree is not develop's. Check what production has that develop doesn't."
              exit 1
            fi
            target=$(git rev-parse HEAD)
          else
            echo "::error title=Production has its own commits::production has commits develop doesn't: $(git rev-list --no-merges --oneline "$sha..$prod" | head -5 | tr '\n' ';'). Get them onto develop first."
            exit 1
          fi
          if [ "$HAS_PROMOTE_TOKEN" != true ] && ! git diff --quiet "$prod" "$target" -- .github/workflows; then
            echo "::error title=PROMOTE_TOKEN missing::This release changes .github/workflows, which GITHUB_TOKEN cannot push. Add the PROMOTE_TOKEN secret (docs/runbooks/environments.md) and promote again."
            exit 1
          fi
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target:refs/heads/production"
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "previous=$prod" >> "$GITHUB_OUTPUT"
      # A GITHUB_TOKEN push starts no workflows, so start CI on production by hand.
      - name: Start CI on production
        if: steps.move.outputs.moved == 'true' && env.HAS_PROMOTE_TOKEN != 'true'
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref production
      - name: Summary
        if: steps.move.outputs.moved == 'true'
        env:
          TARGET: ${{ steps.move.outputs.target }}
          PREVIOUS: ${{ steps.move.outputs.previous }}
        run: |
          {
            echo "### Promoted to production"
            echo "production moved from \`$PREVIOUS\` to \`$TARGET\`."
            echo "CI runs on production next; when it is green, Web hosting deploys the live site and smoke-tests it."
            echo "Rollback: Web hosting, stage live, ref \`$PREVIOUS\`."
          } >> "$GITHUB_STEP_SUMMARY"
