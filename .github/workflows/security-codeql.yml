name: 'Security: CodeQL'

# Static analysis of the JavaScript and TypeScript (security-extended queries). Runs on PRs that
# change code, on every push to develop and production, and weekly. Promote to production requires
# a green run on develop's head (ADR 0014).

on:
  pull_request:
    # Docs-only changes have no code to analyse. Not a required check, so a skipped run never
    # blocks a merge; pushes to develop always run, and the release gate checks that.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  push:
    branches: [develop, production]
  schedule:
    - cron: '0 20 * * 0'
  # Started by pr-auto-merge.yml after it merges.
  workflow_dispatch:

concurrency:
  group: security-codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
