name: 'Agent: Developer'

# Implements a story or bug when it is labelled `agent:ready`, then opens a PR.

on:
  issues:
    types: [labeled]
  # Used by 'Agent: Promote stories' (label events made with GITHUB_TOKEN cannot start workflows).
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to implement'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: agent-developer-${{ github.event.issue.number || github.event.inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent:ready' &&
      (github.event.sender.login == (vars.OWNER_LOGIN || 'nareshpayani') || github.event.sender.login == (vars.AGENT_BOT_LOGIN || 'claude[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_AGENT_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Mark issue in progress
        if: env.HAS_AGENT_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent:in-progress --remove-label agent:ready
      - if: env.HAS_AGENT_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; agent skipped. See docs/agent-workflow.md."
      - if: env.HAS_AGENT_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ (vars.AGENT_BOT_LOGIN || 'claude[bot]') }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ env.ISSUE }}

            Act as the Developer. Follow .claude/agents/developer.md exactly.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*)"
