name: CI

# The merge gate for every PR and the full verification of develop and production (ADR 0014,
# docs/ci-cd.md). Tiers:
#   - pull_request: `changes` decides which suites a PR can affect. Docs-only PRs run only the
#     quality checks and scans; backend-only PRs skip Storybook, the msw-mode E2E and web vitals.
#     Anything under .github/, package.json or package-lock.json runs everything.
#   - push to develop or production, dispatch and the scheduled health runs: every suite, always.
# "CI result" is the one check branch rules require: it passes only when every job passed or was
# skipped by change detection, so required checks never wait on a skipped job.

on:
  pull_request:
  # develop is where PRs merge; production is the live site (ADR 0010, 0011). A promotion pushes to
  # production with PROMOTE_TOKEN (or dispatches this) so CI gates the live deploy.
  push:
    branches: [develop, production]
  # Started by pr-auto-merge.yml after it merges (GITHUB_TOKEN merges don't trigger push runs).
  workflow_dispatch:
  # Health runs on the default branch (develop), so breakage that only shows at some hours (market open or closed) or
  # without a new commit is caught without anyone reporting it. A red run starts agent-pr-fixer.yml,
  # which opens an agent/fix-develop-* PR. Times are UTC: 09:20 and 12:30 IST on weekdays (NSE open),
  # and 20:00 IST every day (market closed).
  schedule:
    - cron: '50 3 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '30 14 * * *'

permissions:
  contents: read

concurrency:
  # The event is part of the key, so a scheduled health run never cancels a push run on develop.
  # Only PR runs cancel: a newer push to the PR replaces them. Runs on develop and production finish,
  # so each merged commit gets its verdict (the release gate and the PR fixer read it).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      backend_only: ${{ steps.diff.outputs.backend_only }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            { echo "docs_only=false"; echo "backend_only=false"; } >> "$GITHUB_OUTPUT"
            echo "Not a PR: every suite runs."; exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          # Prose and agent config that no build, test or deploy reads.
          docs='^(docs/|\.claude/|LICENSE$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|CODEOWNERS$))|\.md$'
          # Server code the web app, Storybook and the msw-mode suites never import.
          backend='^(apps/(api|realtime|quotes)/|infra/)'
          rest=$(grep -vE "$docs" <<< "$files" || true)
          code=$(grep -vE "$backend" <<< "$rest" || true)
          docs_only=false; backend_only=false
          if [ -z "$rest" ]; then docs_only=true; elif [ -z "$code" ]; then backend_only=true; fi
          { echo "docs_only=$docs_only"; echo "backend_only=$backend_only"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Changed areas"
            echo "$(wc -l <<< "$files" | tr -d ' ') files. docs only: $docs_only, backend only: $backend_only."
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # T-181: apps/api's Postgres integration suites run against this service (POSTGRES_TEST_URL,
    # a superuser: the test helper creates the roles and one database per worker). Never skipped.
    services:
      postgres:
        # TimescaleDB for the stored candles (migration 0014), like Compose and Testcontainers.
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: postgres_ci
          TIMESCALEDB_TELEMETRY: 'off'
          NO_TS_TUNE: 'true'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # A schema file changed without a committed migration fails here (ADR 0007).
      - run: npm run db:check -w @nthstock/api
      - run: npm run test
        env:
          POSTGRES_TEST_URL: postgres://postgres:postgres_ci@127.0.0.1:5432/postgres
      - run: npm run build
      # T-237: the OpenAPI document is generated from packages/contracts. A contract change
      # without `npm run openapi` and the regenerated docs/api/openapi.json committed fails here.
      - name: OpenAPI document is up to date
        run: |
          npm run openapi -w @nthstock/api
          if [ -n "$(git status --porcelain -- docs/api/openapi.json)" ]; then
            git diff --stat -- docs/api/openapi.json
            echo "::error file=docs/api/openapi.json::Stale OpenAPI document. Run 'npm run openapi' and commit docs/api/openapi.json."
            exit 1
          fi
      - name: Upload the OpenAPI document
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: docs/api/openapi.json
          if-no-files-found: error

  storybook:
    name: Storybook build and a11y
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.backend_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: npm run build-storybook
      - name: Install Chromium for the Storybook test runner
        uses: ./.github/actions/setup-playwright
      - name: Serve the static Storybook
        run: |
          python3 -m http.server 6006 -d packages/ui/storybook-static >/dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:6006/index.json >/dev/null && exit 0; sleep 1; done
          echo "Storybook did not start" >&2; exit 1
      # axe runs on every story (@storybook/addon-a11y, a11y.test = 'error').
      - run: npm run test-storybook -w @nthstock/ui -- --url http://127.0.0.1:6006
      - name: The deliberately low-contrast canary story must fail
        run: |
          if npm run test-storybook:canary -w @nthstock/ui -- --url http://127.0.0.1:6006; then
            echo "::error::The a11y canary passed, so axe is not running on stories." >&2
            exit 1
          fi

  e2e:
    name: Playwright smoke (Chrome)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.backend_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: npx turbo run build --filter=@nthstock/web^...
      # T04: WebKit too, for the webkit-iphone touch project (iPhone Safari, TFC-16).
      - name: Install Chrome for Testing (Chromium) and WebKit
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium webkit
      # playwright.config.ts builds in msw mode with VITE_MOCK_MARKET_OPEN=true. E2E_WEBKIT turns on
      # the webkit-iphone project for the @touch specs.
      - run: npm run e2e
        env:
          E2E_WEBKIT: '1'
      # NSTOCK-0361: localhost after a fresh pull. `npm run dev` must not depend on the packages'
      # prebuilt dist, so delete the dist the dev server reads from source and load every screen
      # on the Vite dev server with the console watched. (apiClient, contracts and utils stay: the
      # Vite config itself imports them.)
      - name: Dev server without the packages' dist
        run: |
          rm -rf packages/paperEngine/dist packages/marketData/dist packages/ui/dist
          npm run e2e:dev
      # T-100: the frozen 1440 px dashboard screenshot, for the PR (the test also attaches it to
      # the HTML report). Uploaded whether or not the run passed.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-screenshot
          path: apps/web/test-results/**/dashboard-1440.png
          if-no-files-found: warn
          retention-days: 14
      # T-112: stock detail at 1440 and 768 px, for the PR.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stock-detail-screenshots
          path: apps/web/test-results/**/stock-detail-*.png
          if-no-files-found: warn
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # T-169 and T-170: lab Web Vitals budgets (LCP < 2.0 s, CLS < 0.05, TBT as the INP proxy) on the
  # dashboard and stock detail under Lighthouse's desktop throttling, and no main-thread task over
  # 50 ms with 200 ticking symbols. Its own job, one worker, so nothing competes for the CPU. Then
  # Lighthouse CI itself enforces the same budgets plus the performance and accessibility scores.
  perf:
    name: Web vitals and render budgets (Chrome)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.backend_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: npx turbo run build --filter=@nthstock/web^...
      - name: Install Chrome for Testing (Chromium)
        uses: ./.github/actions/setup-playwright
      - run: npm run e2e:perf
      # The measured vitals, the longest main-thread tasks and the Chrome trace, pass or fail.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: apps/web/playwright-report
          retention-days: 14
      # T-169: Lighthouse CI on / and /stocks/INFY (desktop preset, median of 3 runs): LCP, CLS,
      # TBT, performance and accessibility scores. lighthouserc.cjs builds the msw-mode app into
      # dist-lhci and serves it with vite preview (strict CSP on), then writes the reports to
      # apps/web/lighthouse-report only: no public storage, no LHCI server.
      # @lhci/cli runs as a pinned npx download, not a devDependency: its dependency tree fails
      # `npm audit --audit-level=high` with no fixed version. Owner approved 2026-09-27.
      - name: Lighthouse CI
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: |
          CHROME_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          export CHROME_PATH
          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: apps/web/lighthouse-report
          if-no-files-found: warn
          retention-days: 14

  # T-164: the golden path and the scripted-order scenarios (@api specs) against the real backends:
  # apps/api and apps/realtime from their builds (NODE_ENV=test, ENABLE_TEST_CONTROLS=true, a
  # per-run JWT key made by playwright.config.ts), Redis and Postgres as service containers, and an
  # api-mode web build behind the preview proxy. Runs beside the other jobs, so it adds no time to
  # them.
  e2e-api:
    name: Playwright golden path (api mode)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # T-181: apps/api's database, set up like `npm run infra:up`: roles from init.sql, then the
      # migrations as nthstock_owner.
      postgres:
        # TimescaleDB for the stored candles (migration 0014), like Compose and Testcontainers.
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: postgres_ci
          TIMESCALEDB_TELEMETRY: 'off'
          NO_TS_TUNE: 'true'
          POSTGRES_DB: nthstock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nthstock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Create the database roles
        run: psql -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres_ci
          PGDATABASE: nthstock
      - run: npm run db:migrate -w @nthstock/api
        env:
          DATABASE_MIGRATION_URL: postgres://nthstock_owner:nthstock_owner_dev@127.0.0.1:5432/nthstock
      # NSTOCK-0376: the migrated database matches the schema files and hand-written relations,
      # TimescaleDB's own catalog objects skipped.
      - run: npm run db:check -w @nthstock/api
        env:
          DB_CHECK_URL: postgres://nthstock_app:nthstock_app_dev@127.0.0.1:5432/nthstock
      - run: npx turbo run build --filter=@nthstock/web^... --filter=@nthstock/api --filter=@nthstock/realtime --filter=@nthstock/quotes
      # T-171 and NSTOCK-0355: tick-to-screen p95 < 500 ms over this job's Redis, from the API's tick
      # pump and from apps/quotes through the tick streams, run alone so it measures the pipeline.
      - run: npm run test:latency -w @nthstock/realtime
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
      - name: Install Chrome for Testing (Chromium)
        uses: ./.github/actions/setup-playwright
      - run: npm run e2e:api
        env:
          E2E_REDIS_URL: redis://127.0.0.1:6379
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-api
          path: apps/web/playwright-report
          retention-days: 7
      # T-243: the performance smoke on 10,000 seeded users (docs/runbooks/perf-smoke.md). The
      # image preloads only timescaledb: add pg_stat_statements and restart the service. If that
      # fails the smoke still runs, on client-side query timings, and its report says so.
      - name: Preload pg_stat_statements
        continue-on-error: true
        run: |
          # A list of quoted names: one quoted 'a,b' would be read as a single library name.
          psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET shared_preload_libraries = 'timescaledb', 'pg_stat_statements'"
          docker restart ${{ job.services.postgres.id }}
          for _ in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -U postgres -d nthstock && break
            sleep 2
          done
          psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres_ci
          PGDATABASE: nthstock
      # Order ack p95 < 300 ms, PIN login p95 < 200 ms, slowest query p95 < 50 ms. Not a CI gate
      # this phase (spec backend-core §14): a failed budget marks this step, not the job.
      - name: Performance smoke
        continue-on-error: true
        run: npm run perf:smoke -w @nthstock/api
        env:
          DATABASE_URL: postgres://nthstock_app:nthstock_app_dev@127.0.0.1:5432/nthstock
          PERF_STATS_URL: postgres://postgres:postgres_ci@127.0.0.1:5432/nthstock
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: apps/api/perf-report.md
          if-no-files-found: ignore
          retention-days: 30

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks git --redact --verbose .

  # New or changed dependencies with a known high or critical advisory, or a licence that cannot ship
  # in a public repo, fail the PR before they reach develop. npm audit (above) covers the whole tree.
  # Needs the repository's Dependency graph (Settings → Code security), so it runs once the owner
  # turns that on and sets the variable DEPENDENCY_REVIEW to true (docs/ci-cd.md); skipped until then.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0

  # actionlint (with shellcheck at warning level) on every workflow, so a broken workflow fails here
  # instead of silently never running.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
      - run: actionlint -color
        env:
          SHELLCHECK_OPTS: --severity=warning

  # The single required check (ADR 0014). Fails when any job failed or was cancelled; a job skipped
  # by change detection counts as passed.
  result:
    name: CI result
    if: always()
    needs:
      [
        changes,
        checks,
        storybook,
        e2e,
        perf,
        e2e-api,
        audit,
        secrets,
        dependency-review,
        workflow-lint,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          bad=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<< "$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error title=CI failed::$bad"
            exit 1
          fi
