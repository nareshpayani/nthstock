name: 'PR: Auto-merge'

# Not an LLM agent: plain automation. Squash-merges a PR into develop once the Reviewer has labelled it ready-to-merge and every check
# on its head commit is green. Owner decision 2026-09-26 (ADR 0006): agent PRs no longer wait for
# a manual merge. Skipped: PRs without ready-to-merge, drafts, forks, Dependabot, spec PRs (the
# owner still approves specs), and any PR labelled needs-human, agent:fix-needed or do-not-merge.
# Agent and CI config (.github/**, .claude/**, CLAUDE.md) merges like any other change (owner
# decision 2026-10-29). Only real risks are held for the owner with needs-human: the production
# release and deploy workflows, a committed .env file, and a migration that drops or truncates data.
# Add do-not-merge to hold a PR. Only PRs into develop merge; production moves by promotion
# (ADR 0011).

on:
  workflow_run:
    workflows: [CI, 'Security: CodeQL']
    types: [completed]
  pull_request:
    types: [labeled, unlabeled, ready_for_review]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: pr-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER_LOGIN: ${{ vars.OWNER_LOGIN || 'nareshpayani' }}
      AGENT_BOT_LOGIN: ${{ vars.AGENT_BOT_LOGIN || 'claude[bot]' }}
      AUTOMERGE_ENABLED: ${{ vars.AGENT_AUTOMERGE || 'true' }}
    steps:
      - name: Merge every open PR whose checks are all green
        if: env.AUTOMERGE_ENABLED == 'true'
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          merged=0
          prs=$(gh pr list --repo "$repo" --base develop --state open --limit 50 \
            --json number,isDraft,author,labels,headRefOid,headRepositoryOwner,mergeable \
            --jq '.[] | @base64')
          for row in $prs; do
            pr() { echo "$row" | base64 -d | jq -r "$1"; }
            num=$(pr .number)
            author=$(pr .author.login)
            case "$author" in
              "$OWNER_LOGIN"|"$AGENT_BOT_LOGIN"|app/claude) ;;
              *) echo "#$num: author $author is not the owner or an agent, skipping"; continue ;;
            esac
            [ "$(pr .isDraft)" = "false" ] || { echo "#$num: draft, skipping"; continue; }
            [ "$(pr .headRepositoryOwner.login)" = "${repo%%/*}" ] || { echo "#$num: fork, skipping"; continue; }
            if pr '[.labels[].name] | map(select(. == "needs-human" or . == "agent:fix-needed" or . == "do-not-merge" or . == "spec")) | length' | grep -qv '^0$'; then
              echo "#$num: blocking label, skipping"; continue
            fi
            pr '[.labels[].name] | index("ready-to-merge") != null' | grep -qx true \
              || { echo "#$num: no ready-to-merge label from the Reviewer, skipping"; continue; }
            # Held for the owner: only what could take production down, leak a secret or lose data.
            files=$(gh api "repos/$repo/pulls/$num/files" --paginate --jq '.[].filename') \
              || { echo "#$num: could not list changed files, skipping"; continue; }
            risk=""
            held=$(echo "$files" | grep -E '^\.github/workflows/(release-promote-to-production|deploy-web-hosting)\.yml$' || true)
            [ -z "$held" ] || risk="it changes the production release or deploy workflow ($(echo "$held" | tr '\n' ' '))"
            held=$(echo "$files" | grep -E '(^|/)\.env(\.[^/]*)?$' | grep -vE '\.env\.example$' || true)
            [ -z "$held" ] || risk="it adds an environment file that may hold secrets ($(echo "$held" | tr '\n' ' '))"
            sql=$(gh api "repos/$repo/pulls/$num/files" --paginate \
              --jq '.[] | select(.filename | test("^apps/api/drizzle/.*\\.sql$")) | .patch // ""') \
              || { echo "#$num: could not read migration diffs, skipping"; continue; }
            if grep -iqE '^\+.*\b(drop[[:space:]]+(table|column|schema)|truncate)\b' <<< "$sql"; then
              risk="a migration drops or truncates data"
            fi
            if [ -n "$risk" ]; then
              echo "#$num: held for the owner: $risk"
              gh pr edit "$num" --repo "$repo" --add-label needs-human
              gh pr comment "$num" --repo "$repo" --body "Auto-merge is holding this PR because $risk. Everything else merges on its own; this is one of the few changes (production, secrets, data loss) that waits for the owner. Merge it by hand once checked."
              continue
            fi
            [ "$(pr .mergeable)" = "MERGEABLE" ] || { echo "#$num: not mergeable ($(pr .mergeable)), skipping"; continue; }
            sha=$(pr .headRefOid)
            runs=$(gh api "repos/$repo/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "merge") | {status, conclusion}]')
            total=$(echo "$runs" | jq length)
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            bad=$(echo "$runs" | jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","skipped","neutral") | not))] | length')
            # CI's "CI result" job is the gate (ADR 0014): it passes only when every CI job passed or
            # was skipped by change detection. CI runs 5+ jobs on every PR; fewer means the checks
            # have not all started yet.
            gate=$(gh api "repos/$repo/commits/$sha/check-runs?check_name=CI%20result" \
              --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion // ""')
            if [ "$gate" != "success" ]; then
              echo "#$num: CI result is '${gate:-pending}', skipping"; continue
            fi
            if [ "$total" -lt 5 ] || [ "$pending" -gt 0 ] || [ "$bad" -gt 0 ]; then
              echo "#$num: checks not all green (total=$total pending=$pending failed=$bad), skipping"; continue
            fi
            echo "#$num: all $total checks green, squash-merging"
            gh pr merge "$num" --repo "$repo" --squash --delete-branch --match-head-commit "$sha"
            merged=1
            merged_pr="$num"
            # One merge per run: the other PRs' checks ran against the old develop. The conflict
            # resolver and the next run (after their CI, or the hourly sweep) pick them up.
            break
          done
          # Merges made with GITHUB_TOKEN do not trigger push workflows, so start them on develop explicitly.
          if [ "$merged" -eq 1 ]; then
            for wf in ci.yml security-codeql.yml agent-merge-conflict-resolver.yml repo-sync-labels.yml; do
              gh workflow run "$wf" --repo "$repo" --ref develop
            done
            # Close the story, bug and epic issues this PR completed, with a comment on each.
            gh workflow run issues-close-completed.yml --repo "$repo" --ref develop -f pr="$merged_pr"
          fi
