name: 'Agent: Reviewer'

# Reviews every PR from the owner or the agents, then routes it:
# blocking findings -> `agent:fix-needed` (Fixer runs); none -> `ready-to-merge` (owner merges).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: agent-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == (vars.OWNER_LOGIN || 'nareshpayani') || github.event.pull_request.user.login == (vars.AGENT_BOT_LOGIN || 'claude[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_AGENT_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Enforce the review-round limit
        id: rounds
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MAX_ROUNDS: ${{ vars.AGENT_MAX_REVIEW_ROUNDS || 3 }}
        run: |
          rounds=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '[.comments[].body | select(contains("<!-- nthstock-agent-review -->"))] | length')
          echo "rounds=$rounds" >> "$GITHUB_OUTPUT"
          if [ "$rounds" -ge "$MAX_ROUNDS" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human --remove-label agent:fix-needed
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "Agent review limit ($MAX_ROUNDS rounds) reached. Labelled \`needs-human\` for the owner."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.rounds.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - if: steps.rounds.outputs.skip != 'true' && env.HAS_AGENT_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; agent skipped. See docs/agent-workflow.md."
      - if: steps.rounds.outputs.skip != 'true' && env.HAS_AGENT_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ (vars.AGENT_BOT_LOGIN || 'claude[bot]') }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW ROUND: ${{ steps.rounds.outputs.rounds }} (0 = first review)

            Act as the Reviewer. Follow .claude/agents/reviewer.md exactly.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh issue create:*),Bash(gh issue view:*)"
