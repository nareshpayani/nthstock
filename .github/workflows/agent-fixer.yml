name: 'Agent: Fixer'

# Self-healing CI. Fixes, on the PR's own branch:
#   - blocking review findings (label `agent:fix-needed`),
#   - red CI on any owner, agent or Dependabot PR,
# and when CI goes red on develop (where PRs merge, ADR 0010), opens an `agent/fix-develop-*` PR
# (develop and production are never pushed to).
# An hourly sweep catches what events miss: Dependabot-triggered runs get no secrets, and a PR
# that went red because develop was broken needs another look once develop is green again.
# There is no attempt limit (owner decision 2026-10-25): the Fixer keeps going until CI is green.
# The one safeguard is for no progress: when the last AGENT_NO_PROGRESS_RUNS (default 5) CI runs
# on a PR, each on a new commit, all fail in exactly the same jobs and steps, the PR gets
# `needs-human` instead of another identical attempt, so a stuck loop cannot drain the plan quota.

on:
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      pr: ${{ steps.target.outputs.pr }}
      branch: ${{ steps.target.outputs.branch }}
      reason: ${{ steps.target.outputs.reason }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          OWNER: ${{ (vars.OWNER_LOGIN || 'nareshpayani') }}
          BOT: ${{ (vars.AGENT_BOT_LOGIN || 'claude[bot]') }}
          NO_PROGRESS_RUNS: ${{ (vars.AGENT_NO_PROGRESS_RUNS || '5') }}
          LABEL_PR: ${{ github.event.pull_request.number }}
          LABEL_BRANCH: ${{ github.event.pull_request.head.ref }}
          LABEL_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          emit() { # mode pr branch reason
            { echo "mode=$1"; echo "pr=$2"; echo "branch=$3"; echo "reason=$4"; } >> "$GITHUB_OUTPUT"
            echo "Target: mode=$1 pr=$2 branch=$3 ($4)"
          }
          fix_develop_pr_open() {
            [ -n "$(gh pr list --repo "$repo" --state open --limit 100 --json headRefName \
              --jq '.[] | select(.headRefName | test("^(agent|claude)/fix-develop-")) | .headRefName')" ]
          }
          develop_is_red() {
            # The latest finished run on develop: a push, the post-merge dispatch or a scheduled health run.
            [ "$(gh run list --repo "$repo" --workflow ci.yml --branch develop \
              --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')" = "failure" ]
          }
          # The failing jobs and steps of a CI run, e.g. "Test/Run tests,Lint/Lint".
          failure_signature() {
            gh run view "$1" --repo "$repo" --json jobs \
              --jq '[.jobs[] | select(.conclusion == "failure") | .name + "/" + ([.steps[]? | select(.conclusion == "failure") | .name] | join("+"))] | sort | join(",")'
          }
          # True when the last NO_PROGRESS_RUNS CI runs on the branch are all red, each on a different
          # commit, with the same failure signature: fixes are landing but nothing changes.
          no_progress() {
            local branch="$1" runs ids distinct sig first=""
            runs=$(gh run list --repo "$repo" --workflow ci.yml --branch "$branch" --event pull_request \
              --status completed --limit "$NO_PROGRESS_RUNS" --json databaseId,conclusion,headSha)
            [ "$(jq 'length' <<< "$runs")" -ge "$NO_PROGRESS_RUNS" ] || return 1
            [ "$(jq '[.[] | select(.conclusion != "failure")] | length' <<< "$runs")" -eq 0 ] || return 1
            distinct=$(jq '[.[].headSha] | unique | length' <<< "$runs")
            [ "$distinct" -ge "$NO_PROGRESS_RUNS" ] || return 1
            ids=$(jq -r '.[].databaseId' <<< "$runs")
            for id in $ids; do
              sig=$(failure_signature "$id")
              [ -n "$first" ] || first="$sig"
              [ "$sig" = "$first" ] || return 1
            done
            echo "$first"
          }
          # Prints "ok" when the PR is one agents may fix; flags it needs-human when fixes stop making progress.
          eligible() {
            local pr="$1" info author cross labels branch stuck
            info=$(gh pr view "$pr" --repo "$repo" --json author,isCrossRepository,labels,state,headRefName)
            [ "$(jq -r .state <<< "$info")" = "OPEN" ] || return 0
            cross=$(jq -r .isCrossRepository <<< "$info")
            author=$(jq -r .author.login <<< "$info")
            labels=$(jq -r '[.labels[].name] | join(",")' <<< "$info")
            branch=$(jq -r .headRefName <<< "$info")
            [ "$cross" = "false" ] || return 0
            case ",$labels," in *,needs-human,*) return 0 ;; esac
            case "$author" in
              "$OWNER"|"$BOT"|app/claude|app/dependabot|dependabot\[bot\]) ;;
              *) return 0 ;;
            esac
            if stuck=$(no_progress "$branch"); then
              gh pr edit "$pr" --repo "$repo" --add-label needs-human >/dev/null
              gh pr comment "$pr" --repo "$repo" --body "CI failed the same way ($stuck) on each of the last $NO_PROGRESS_RUNS commits, so fixes are not making progress. Labelled \`needs-human\`; push a change and remove the label to let the Fixer carry on."
              return 0
            fi
            echo ok
          }

          if [ "$EVENT" = "pull_request" ]; then
            if [ "$LABEL" = "agent:fix-needed" ] && [ "$LABEL_HEAD_REPO" = "$repo" ] \
               && { [ "$SENDER" = "$OWNER" ] || [ "$SENDER" = "$BOT" ]; }; then
              emit pr "$LABEL_PR" "$LABEL_BRANCH" "review findings"
            fi
            exit 0
          fi

          if [ "$EVENT" = "workflow_run" ]; then
            [ "$RUN_CONCLUSION" = "failure" ] && [ "$RUN_HEAD_REPO" = "$repo" ] || exit 0
            if [ "$RUN_BRANCH" = "develop" ] && [[ "$RUN_EVENT" =~ ^(push|schedule|workflow_dispatch)$ ]]; then
              fix_develop_pr_open && { echo "A fix-develop PR is already open."; exit 0; }
              emit develop "" "agent/fix-develop-${RUN_SHA:0:7}" "CI is red on develop ($RUN_URL)"
              exit 0
            fi
            [ "$RUN_EVENT" = "pull_request" ] || exit 0
            # A PR that is red because develop is red is fixed by the fix-develop PR, not on its own branch.
            develop_is_red && { echo "develop is red; the fix-develop PR handles this."; exit 0; }
            pr=$(gh pr list --repo "$repo" --head "$RUN_BRANCH" --state open --json number --jq '.[0].number // ""')
            [ -n "$pr" ] || exit 0
            # A PR whose head is develop or production is never fixed on its branch: agents never push there.
            case "$RUN_BRANCH" in develop|production) exit 0 ;; esac
            [ "$(eligible "$pr")" = "ok" ] && emit pr "$pr" "$RUN_BRANCH" "failing CI ($RUN_URL)"
            exit 0
          fi

          # schedule / workflow_dispatch: sweep. develop first, then the oldest red PR.
          if develop_is_red; then
            fix_develop_pr_open || emit develop "" "agent/fix-develop-$(git ls-remote "https://github.com/$repo" refs/heads/develop | cut -c1-7)" "CI is red on develop"
            exit 0
          fi
          for row in $(gh pr list --repo "$repo" --state open --limit 100 \
              --json number,headRefName,headRefOid --jq 'sort_by(.number) | .[] | "\(.number):\(.headRefName):\(.headRefOid)"'); do
            pr=${row%%:*}; rest=${row#*:}; branch=${rest%%:*}; sha=${rest#*:}
            [ "$branch" != "develop" ] || continue
            conclusion=$(gh run list --repo "$repo" --workflow ci.yml --commit "$sha" --event pull_request \
              --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            [ "$conclusion" = "failure" ] || continue
            if [ "$(eligible "$pr")" = "ok" ]; then
              emit pr "$pr" "$branch" "failing CI on the PR head ($sha)"
              exit 0
            fi
          done

  fix:
    needs: resolve-target
    if: needs.resolve-target.outputs.mode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_AGENT_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    concurrency:
      group: agent-fixer-${{ needs.resolve-target.outputs.pr || 'develop' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        # No persisted GITHUB_TOKEN: the agent action points origin at its app token, so its pushes
        # start CI and the Reviewer. checkout@v7 keeps the token in an includeIf file the action
        # cannot clear, and GITHUB_TOKEN pushes start no workflows (NSTOCK-0377).
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-target.outputs.mode == 'develop' && 'develop' || needs.resolve-target.outputs.branch }}
          fetch-depth: 0
      - name: Block pushes to production and develop
        run: |
          printf '#!/bin/sh\nwhile read -r _ _ ref _; do case "$ref" in refs/heads/production|refs/heads/main|refs/heads/develop) echo "Pushing to production or develop is not allowed." >&2; exit 1 ;; esac; done\nexit 0\n' > .git/hooks/pre-push
          chmod +x .git/hooks/pre-push
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Installing can be the very thing that is broken (e.g. a bad dependency bump), so do not fail here.
      - run: npm ci || echo "::warning::npm ci failed; the Fixer will diagnose it."
      - if: env.HAS_AGENT_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; agent skipped. See docs/agent-workflow.md."
      - id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: env.HAS_AGENT_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Commits are authored as the owner, not the app (owner decision 2026-10-21).
          bot_name: ${{ vars.OWNER_LOGIN || 'nareshpayani' }}
          bot_id: ${{ vars.OWNER_ID || '15100692' }}
          allowed_bots: ${{ (vars.AGENT_BOT_LOGIN || 'claude[bot]') }}
          prompt: |
            REPO: ${{ github.repository }}
            MODE: ${{ needs.resolve-target.outputs.mode }}
            PR NUMBER: ${{ needs.resolve-target.outputs.pr }}
            BRANCH: ${{ needs.resolve-target.outputs.branch }}
            REASON: ${{ needs.resolve-target.outputs.reason }}

            Act as the Fixer. Follow .claude/agents/fixer.md exactly.
          # gh is limited to what fixer.md needs: read PRs, runs and review threads, comment and reply,
          # edit labels, check out, open the fix-develop PR and the needs-human issue. No `gh pr merge`.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh pr checkout:*),Bash(gh pr create:*),Bash(gh issue create:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh api repos/*/pulls/*/comments*),Bash(gh api repos/*/pulls/*/reviews*),Bash(gh api repos/*/issues/*/comments*),Bash(gh api repos/*/actions/*),Bash(gh api repos/*/commits/*),Bash(bash tools/github/issueKey.sh:*)"
      # The other half of the no-progress safeguard: a CI-fix run that pushes nothing leaves the same
      # red commit, which the hourly sweep would pick again forever. Hand it to the owner instead.
      - name: Flag a CI fix that pushed nothing
        if: >-
          always() && env.HAS_AGENT_TOKEN == 'true' && needs.resolve-target.outputs.mode == 'pr' &&
          startsWith(needs.resolve-target.outputs.reason, 'failing CI')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve-target.outputs.pr }}
          BEFORE: ${{ steps.before.outputs.sha }}
        run: |
          info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,labels)
          [ "$(jq -r .state <<< "$info")" = "OPEN" ] || exit 0
          [ "$(jq -r .headRefOid <<< "$info")" = "$BEFORE" ] || exit 0
          jq -e '[.labels[].name] | index("needs-human")' <<< "$info" >/dev/null && exit 0
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "The Fixer finished without pushing a fix for the red CI on ${BEFORE:0:7} ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Labelled \`needs-human\`; remove the label to let the Fixer try again."
