name: Bug
description: Something is broken
title: 'NSTOCK-XXXX : '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Leave `NSTOCK-XXXX` in the title: a workflow gives the bug the next key. Name an epic below
        to file the bug under it.
  - type: input
    id: epic
    attributes:
      label: Epic
      description: Optional. The epic this bug belongs to, by key or issue number.
      placeholder: 'NSTOCK-0001'
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where (page, endpoint, PR)
