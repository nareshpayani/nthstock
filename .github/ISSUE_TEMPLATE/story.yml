name: Story
description: A small, shippable piece of a feature
labels: [story]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a <user>, I want <goal> so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec
      placeholder: 'Spec PR: #123'
  - type: textarea
    id: notes
    attributes:
      label: Notes (files, packages, out of scope)
